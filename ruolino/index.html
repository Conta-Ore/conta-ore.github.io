<title>Ruolino Paga</title>

<body style="margin:0;padding:24px;font:16px/1.5 system-ui,sans-serif;color:#131a24;background:#eceff5">
<p>Il Ruolino sta su <a href="https://ruolino-paga.github.io/">ruolino-paga.github.io</a>, con i turni del portale dentro. Se avevi l'icona di questa pagina sul telefono, toglila e aggiungi quella nuova da lì.</p>
<script>
(function () {
  var via = function () { location.replace('https://ruolino-paga.github.io/'); };
  if (!('serviceWorker' in navigator)) return via();
  navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
    .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('ruolino-ist-') === 0; }).map(function (k) { return caches.delete(k); })); }) : null; })
    .catch(function () { /* niente */ }).then(via);
})();
</script>
</body>
</html>

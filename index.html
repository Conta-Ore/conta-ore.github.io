<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conta Ore</title>
<meta name="description" content="I tuoi turni, salvati sul tuo telefono.">
<meta name="theme-color" content="#111821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conta Ore">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--ink:#131a24;--muted:#64748b;--bg:#eceff5;--card:#fff;--line:#dbe2ec;--cambio:#fdf3d7;--no:#b45309;--ok:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e9eef6;--muted:#94a3b8;--bg:#0b1016;--card:#161e28;--line:#2b3746;--cambio:#3a2f12;--no:#fbbf24;--ok:#4ade80}}
:root[data-theme="dark"]{--ink:#e9eef6;--muted:#94a3b8;--bg:#0b1016;--card:#161e28;--line:#2b3746;--cambio:#3a2f12;--no:#fbbf24;--ok:#4ade80}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#111821;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:9px}
header h1{margin:0;font:700 21px/1 system-ui,sans-serif;flex:1}
main{max-width:600px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:16px}
label{display:block;font-weight:600;margin-top:10px}
input{width:100%;margin-top:6px;padding:13px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--ink);font:16px system-ui,sans-serif}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;border:0;background:var(--ink);color:var(--card);font:600 17px system-ui,sans-serif;cursor:pointer}
.btn.chiaro{background:transparent;color:var(--ink);border:1px solid var(--line)}
.msg{margin-top:8px;font-size:14px;color:var(--muted)}
.stato{margin-top:14px;font-size:15px;font-weight:600;color:var(--ok)}
.stato.no{color:var(--no)}
h2{margin:18px 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.giorno{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.giorno.cambiato{background:var(--cambio)}
.giorno.libero .o{color:var(--muted);font-weight:500}
.g{font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.o{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.s{font-size:14px;color:var(--muted)}
.prima{font-size:13px;color:var(--no);margin-top:2px}
.piede{display:flex;gap:10px;margin-top:6px}
.piede button{flex:1;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font:14px system-ui,sans-serif}
</style>
</head>
<body>
<header><img src="icons/icon-192.png" alt=""><h1>Conta Ore</h1></header>
<main>
  <div class="card" id="installa" hidden>
    <div id="inst-ios" hidden>Per averla come app: tocca <b>Condividi</b> (il quadrato con la freccia ↑) e poi <b>Aggiungi alla schermata Home</b>.</div>
    <button type="button" class="btn" id="inst-and" hidden>Installa sul telefono</button>
  </div>

  <section id="accesso" hidden>
    <div class="card">
      <label for="codice">Codice operatore</label>
      <input id="codice" autocomplete="username" autocapitalize="characters" placeholder="es. HRM-0042">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button type="button" class="btn" id="entra">Entra</button>
      <div class="msg" id="acc-msg"></div>
      <div class="msg">Codice e password restano su questo telefono: servono solo per entrare nel portale dei turni.</div>
    </div>
  </section>

  <section id="turni" hidden>
    <div class="stato" id="stato"></div>
    <div id="lista"></div>
    <button type="button" class="btn" id="invia">Invia su WhatsApp o email</button>
    <div class="msg" id="copie"></div>
    <div class="piede">
      <button type="button" id="archivio">Esporta tutte le copie</button>
      <button type="button" id="esci">Esci</button>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
